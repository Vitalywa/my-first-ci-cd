name: Multi-Job Practice Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Compiling Code
        run: |
          echo "Имитируем компиляцию приложения..."
          sleep 5

      - name: Build Success Notice
        run: echo "Сборка успешно завершена!"

  security-check-job:
    runs-on: ubuntu-latest
    steps:
      - name: Scanning Dependencies
        run: |
          echo "Ищем уязвимости в коде..."
          sleep 5

      - name: Security Clear Notice
        run: echo "Проверка безопасности пройдена!"

  # НАША НОВАЯ ТРЕТЬЯ ДЖОБА
  deploy-job:
    runs-on: ubuntu-latest
    # КРИТИЧЕСКИ ВАЖНАЯ СТРОКА: ждем успешного завершения ДВУХ предыдущих задач
    needs: [build-job, security-check-job]
    steps:
      - name: Deploying to Production Server
        run: |
          echo "Все проверки пройдены!"
          echo "Скачиваем готовый билд и отправляем на продакшн сервер..."
          echo "Деплой завершен успешно. Сайт обновлен!"
