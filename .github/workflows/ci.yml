name: Conditional Jobs Practice

# Теперь мы разрешаем запуск пайплайна для ВСЕХ веток (две звездочки)
on:
  push:
    branches: [ "**" ]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Run Tests
        run: echo "Запускаем тесты кода... Они работают для любой ветки!"

  deploy-job:
    runs-on: ubuntu-latest
    needs: [test-job]
    # Условие: джоба запустится ТОЛЬКО если пуш был в ветку main
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Prod
        run: echo "Ура! Это ветка main, катим код на продакшн!"
