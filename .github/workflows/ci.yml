name: My First Practice Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Привет! Это запуск пайплайна с переменными!"

      # ШАГ 1: Генерируем данные и записываем в специальный файл GitHub
      - name: Generate Dynamic Version
        run: |
          echo "APP_VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "Мы сохранили версию во внутренний буфер GitHub"

      # ШАГ 2: Пытаемся прочитать эту переменную на следующем шаге
      - name: Use Saved Version
        run: |
          echo "Успех! Мы видим переменную из прошлого шага:"
          echo "Текущая версия приложения: $APP_VERSION"

