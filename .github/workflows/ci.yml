name: DevSecOps Security Scan

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan-job:
    runs-on: ubuntu-latest
    steps:
      # 1. Обязательно скачиваем код нашего репозитория
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Используем готовый официальный экшен для запуска сканера Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs' # 'fs' означает File System — сканировать файлы нашего проекта
          scan-ref: '.'   # Точка означает "сканировать текущую папку"
          format: 'table' # Вывести отчет в виде красивой текстовой таблицы
          exit-code: '0'  # Если найдет уязвимости — не падать (для первого теста оставим 0)
